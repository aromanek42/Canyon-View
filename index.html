<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Marine Buoy Conditions</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .dashboard {
            max-width: 600px;
            margin: 40px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .meta {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .card-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f1f5f9;
            margin-top: 5px;
        }
        .loading {
            color: #ea580c;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1 id="station-title">Buoy 44065 Live Conditions</h1>
    <div class="meta" id="station-meta">Loading latest NDBC transmission...</div>

    <div id="data-grid" class="grid" style="display:none;">
        <div class="card">
            <div class="card-label">Wave Height</div>
            <div id="wave-height" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Dominant Wave Period</div>
            <div id="wave-period" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Wind Speed / Gust</div>
            <div id="wind-speed" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Wind Direction</div>
            <div id="wind-dir" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Water Temp</div>
            <div id="water-temp" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Atmospheric Pressure</div>
            <div id="pressure" class="card-value">--</div>
        </div>
    </div>
    
    <div id="status-message" class="loading">Connecting to National Data Buoy Center...</div>
</div>

<script>
    // Station 44065 is active and operational near NY Harbor entrance/shelf edge
    const STATION_ID = '44065'; 
    
    async function fetchBuoyData() {
        const rawUrl = `https://noaa.gov{STATION_ID}.txt`;
        const proxyUrl = `https://allorigins.win{encodeURIComponent(rawUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("Could not fetch buoy file.");
            const text = await response.text();

            // Split raw file into individual structural rows
            const lines = text.trim().split('\n');
            if (lines.length < 3) throw new Error("Empty data matrix returned.");

            // Extract structural metrics from fixed positions 
            // Line 0 contains metrics names, Line 2 contains latest metric records
            const headers = lines[0].trim().split(/\s+/);
            const latestRow = lines[2].trim().split(/\s+/);

            // Assemble header array matching values explicitly
            const data = {};
            headers.forEach((header, index) => {
                data[header] = latestRow[index];
            });

            // Unit conversions from metric to marine standard imperial
            document.getElementById('wave-height').innerText = data.WVHT !== 'MM' ? `${(parseFloat(data.WVHT) * 3.28084).toFixed(1)} ft` : 'N/A';
            document.getElementById('wave-period').innerText = data.DPD !== 'MM' ? `${data.DPD} sec` : 'N/A';
            
            const windSpeedKts = data.WSPD !== 'MM' ? (parseFloat(data.WSPD) * 1.94384).toFixed(1) : 'N/A';
            const windGustKts = data.GST !== 'MM' ? (parseFloat(data.GST) * 1.94384).toFixed(1) : 'N/A';
            document.getElementById('wind-speed').innerText = `${windSpeedKts} / ${windGustKts} kts`;
            
            document.getElementById('wind-dir').innerText = data.WDIR !== 'MM' ? `${data.WDIR}°` : 'N/A';
            document.getElementById('water-temp').innerText = data.WTMP !== 'MM' ? `${((parseFloat(data.WTMP) * 9/5) + 32).toFixed(1)} °F` : 'N/A';
            document.getElementById('pressure').innerText = data.BAR !== 'MM' ? `${data.BAR} hPa` : 'N/A';

            // Print the timestamp tracking exactly when the data payload was measured
            document.getElementById('station-meta').innerText = `Latest Reading: ${data['#YY']}-${data.MM}-${data.DD} @ ${data.hh}:${data.mm} UTC`;
            
            // Toggle visibility to render dashboard cards
            document.getElementById('status-message').style.display = 'none';
            document.getElementById('data-grid').style.display = 'grid';

        } catch (error) {
            document.getElementById('status-message').innerText = `Error processing live matrix stream from Buoy ${STATION_ID}.`;
            document.getElementById('status-message').className = '';
            document.getElementById('status-message').style.color = '#ef4444';
            console.error(error);
        }
    }

    fetchBuoyData();
</script>

</body>
</html>
