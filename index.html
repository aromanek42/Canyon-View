<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Northeast Buoy Conditions</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .dashboard {
            max-width: 600px;
            margin: 40px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .meta {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .card-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f1f5f9;
            margin-top: 5px;
        }
        .loading {
            color: #ea580c;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1 id="station-title">Buoy 44065 Live Conditions</h1>
    <div class="meta" id="station-meta">Connecting to NERACOOS oceanographic servers...</div>

    <div id="data-grid" class="grid" style="display:none;">
        <div class="card">
            <div class="card-label">Wave Height</div>
            <div id="wave-height" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Dominant Wave Period</div>
            <div id="wave-period" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Wind Speed</div>
            <div id="wind-speed" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Wind Direction</div>
            <div id="wind-dir" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Water Temp</div>
            <div id="water-temp" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Air Temp</div>
            <div id="air-temp" class="card-value">--</div>
        </div>
    </div>
    
    <div id="status-message" class="loading">Requesting real-time telemetry array...</div>
</div>

<script>
    async function fetchBuoyData() {
        const statusElement = document.getElementById('status-message');
        
        // NERACOOS ERDDAP JSON endpoint for Buoy 44065 requesting the absolute latest 1 record
        const apiUrl = 'https://neracoos.org';

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("API service returned an error status.");
            
            const json = await response.json();
            
            // Map column arrays to rows cleanly
            const columns = json.table.columnNames;
            const values = json.table.rows[0];
            
            const data = {};
            columns.forEach((colName, index) => {
                data[colName] = values[index];
            });

            // Populate dashboard (converting standard metric units to marine imperial equivalents)
            document.getElementById('wave-height').innerText = data.wave_height ? `${(data.wave_height * 3.28084).toFixed(1)} ft` : 'N/A';
            document.getElementById('wave-period').innerText = data.dominant_wave_period ? `${data.dominant_wave_period} sec` : 'N/A';
            document.getElementById('wind-speed').innerText = data.wind_speed ? `${(data.wind_speed * 1.94384).toFixed(1)} kts` : 'N/A';
            document.getElementById('wind-dir').innerText = data.wind_direction ? `${data.wind_direction}°` : 'N/A';
            document.getElementById('water-temp').innerText = data.sea_surface_temperature ? `${((data.sea_surface_temperature * 9/5) + 32).toFixed(1)} °F` : 'N/A';
            document.getElementById('air-temp').innerText = data.air_temperature ? `${((data.air_temperature * 9/5) + 32).toFixed(1)} °F` : 'N/A';

            // Print the timestamp tracking exactly when the data payload was measured
            const cleanTime = new Date(data.time).toLocaleString();
            document.getElementById('station-meta').innerText = `Latest Transmission: ${cleanTime}`;
            
            // Show the dashboard UI grid
            statusElement.style.display = 'none';
            document.getElementById('data-grid').style.display = 'grid';

        } catch (error) {
            statusElement.innerText = "Error: Unable to process data from the ERDDAP server.";
            statusElement.className = '';
            statusElement.style.color = '#ef4444';
            console.error("Technical trace:", error);
        }
    }

    fetchBuoyData();
</script>
</body>
</html>
