<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudson Canyon 1000 FM Marine Weather</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #102a43;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: #0b69a3;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .meta-info {
            font-size: 0.9em;
            color: #627d98;
            margin-bottom: 20px;
        }
        .forecast-box {
            background-color: #f8fafc;
            border-left: 4px solid #0b69a3;
            padding: 15px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 1.05em;
            line-height: 1.6;
            overflow-x: auto;
        }
        .loading {
            color: #627d98;
            font-style: italic;
        }
        .error {
            color: #d32f2f;
            font-weight: bold;
        }
        .refresh-btn {
            background-color: #0b69a3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            background-color: #095585;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hudson Canyon to Baltimore Canyon to 1000 FM</h1>
    <div class="meta-info">Zone ID: ANZ820 | Source: NOAA Text Product API</div>
    
    <button class="refresh-btn" onclick="fetchMarineForecast()">Refresh Forecast</button>
    
    <div id="forecast-container">
        <p class="loading">Fetching current marine conditions from NOAA...</p>
    </div>
</div>

<script>
    async function fetchMarineForecast() {
        const container = document.getElementById('forecast-container');
        container.innerHTML = '<p class="loading">Loading official offshore text product...</p>';
        
        // This endpoint fetches the most recent text forecast product issued for the regional offshore waters
        const apiUrl = 'https://weather.gov';

        try {
            const response = await fetch(apiUrl, {
                headers: {
                    'User-Agent': 'HudsonCanyonWeatherPage/2.0 (marine-safety-update@example.com)'
                }
            });
            
            if (!response.ok) throw new Error('API request failed');
            
            const data = await response.json();
            
            // Get the text from the primary index entry [@graph or graph list]
            if (data['@graph'] && data['@graph'][0] && data['@graph'][0].productText) {
                renderText(data['@graph'][0].productText, container);
            } else if (data.products && data.products[0]) {
                // Secondary check: Fetch the text directly from the latest single product item URL if grouped indices are different
                const specificProductUrl = data.products[0]['@id'];
                const productResponse = await fetch(specificProductUrl, {
                    headers: { 'User-Agent': 'HudsonCanyonWeatherPage/2.0' }
                });
                const productData = await productResponse.json();
                renderText(productData.productText, container);
            } else {
                throw new Error('Text field not found in response');
            }
            
        } catch (error) {
            // Bulletproof Fallback: Direct iframe embedding if API fails due to temporary traffic
            container.innerHTML = `
                <p class="error">Direct API collection timed out.</p>
                <p>Displaying the official web report mirror below:</p>
                <iframe src="https://weather.gov" style="width:100%; height:500px; border:1px solid #cbd5e1; border-radius:6px;"></iframe>
            `;
            console.error('Fetch error:', error);
        }
    }

    function renderText(rawText, containerElement) {
        // Find the specific section for ANZ820 out of the broader offshore document
        let sectionText = rawText;
        const searchPattern = /ANZ820/i;
        
        if (searchPattern.test(rawText)) {
            const index = rawText.search(searchPattern);
            // Slice the text from ANZ820 onward to hide unrelated regions, or show full text if needed
            sectionText = rawText.substring(index);
        }

        containerElement.innerHTML = `
            <h3>Live Offshore Forecast & Marine Warnings</h3>
            <div class="forecast-box">${escapeHtml(sectionText)}</div>
        `;
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Initialize immediately
    fetchMarineForecast();
</script>

</body>
</html>
