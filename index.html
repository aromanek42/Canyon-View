<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudson Canyon Live Beaufort Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c1013;
            color: #e0e6ed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .weather-card {
            max-width: 550px;
            width: 100%;
            background: #141d26;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            border: 1px solid #243342;
        }
        h2 {
            margin-top: 0;
            color: #fff;
            font-size: 1.6em;
            letter-spacing: 0.5px;
        }
        .wind-speed-badge {
            display: inline-block;
            background: #1e2d3b;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #70b5ff;
            margin-bottom: 15px;
        }
        .status-tag {
            font-size: 1.8em;
            font-weight: 800;
            margin: 15px 0 5px 0;
            transition: color 0.3s ease;
        }
        .graphic-container {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            background: #000;
            aspect-ratio: 4 / 3;
        }
        .forecast-text {
            font-size: 0.95em;
            color: #8899a6;
            line-height: 1.5;
            background: #192431;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            border-left: 4px solid #1da1f2;
        }
    </style>
</head>
<body>

<div class="weather-card">
    <h2>Hudson Canyon 1000 FM</h2>
    <div class="wind-speed-badge" id="raw-wind">Reading NOAA Data...</div>
    
    <div class="status-tag" id="beaufort-status">Force --</div>
    <div style="font-size: 0.9em; color:#a0a0a0;" id="beaufort-desc">Determining sea state...</div>
    
    <!-- Dynamic SVG Target Container -->
    <div class="graphic-container" id="svg-container"></div>
    
    <div class="forecast-text" id="forecast-text">Fetching latest offshore text forecast...</div>
</div>

<script>
        // We route the NOAA endpoint through a public CORS proxy to bypass browser security blocks
    const apiURL = "https://corsproxy.io";

    async function updateBeaufortDisplay() {
        try {
            // No custom headers are needed when using the proxy
            const response = await fetch(apiURL);
            if (!response.ok) throw new Error("API call failed");
            
            const data = await response.json();
            const currentForecastText = data.properties.periods[0].detailedForecast;
            document.getElementById('forecast-text').innerText = currentForecastText;

            // Extract numbers preceding "kt" to determine velocity
            const knotMatch = currentForecastText.match(/(\d+)\s*to\s*(\d+)\s*kt/i) || currentForecastText.match(/(\d+)\s*kt/i);
            
            let maxKnots = 0;
            if (knotMatch) {
                // Grab the higher digit value inside a range description or the single number
                maxKnots = knotMatch[2] ? parseInt(knotMatch[2]) : parseInt(knotMatch[1]);
                document.getElementById('raw-wind').innerText = `Live Wind Window: ${maxKnots} Knots Max`;
            } else {
                document.getElementById('raw-wind').innerText = "Wind: Light / Variable";
            }

            const force = getBeaufortForce(maxKnots);
            const condition = beaufortMeta[force];

            // Render status texts
            const statusTag = document.getElementById('beaufort-status');
            statusTag.innerText = `Force ${force}: ${condition.name}`;
            statusTag.style.color = condition.dynamicColor;
            document.getElementById('beaufort-desc').innerText = condition.desc;

            // Generate and inject the custom inline SVG vector graphic
            document.getElementById('svg-container').innerHTML = generateSeaStateSVG(force);

        } catch (error) {
            console.error("Error setting up dynamic marine vector graphic:", error);
            document.getElementById('raw-wind').innerText = "Data unavailable";
            document.getElementById('forecast-text').innerText = "Failed to communicate with NOAA servers. Please refresh the page.";
        }
    }


    // This function generates the SVG template dynamically based on Beaufort specs
    function generateSeaStateSVG(force) {
        const config = beaufortMeta[force];
        const amp = config.waveAmp;
        
        // Define paths for two layers of waves using sine-wave approximations
        let wavePathBehind = `M 0 220 Q 100 ${220 - amp * 0.7} 200 220 T 400 220 L 400 300 L 0 300 Z`;
        let wavePathFront  = `M 0 240 Q 80  ${240 - amp}       160 240 T 320 240 T 400 240 L 400 300 L 0 300 Z`;
        
        // Add extreme jagged peaks for severe storm warnings (Force 8+)
        if (force >= 8) {
            wavePathFront = `M 0 240 L 50 ${240 - amp} L 100 245 L 170 ${230 - amp} L 240 250 L 310 ${235 - amp} L 400 240 L 400 300 L 0 300 Z`;
        }

        // Conditionally generate foam lines
        let foamElements = '';
        if (config.foam) {
            const opacity = Math.min(0.2 + (force * 0.06), 0.9);
            foamElements = `
                <path d="M 10 ${230 - amp*0.3} Q 90 ${220 - amp*0.5} 150 ${235 - amp*0.2}" stroke="#ffffff" stroke-width="${Math.min(2 + force, 8)}" fill="none" opacity="${opacity}" stroke-dasharray="10 15"/>
                <path d="M 120 ${245 - amp*0.6} Q 220 ${230 - amp*0.8} 340 ${240 - amp*0.4}" stroke="#ffffff" stroke-width="${Math.min(3 + force, 10)}" fill="none" opacity="${opacity}" stroke-dasharray="30 10 10 20"/>
            `;
        }

        // Dynamically add wind lines crossing the sky depending on severity
        let windLines = '';
        const windCount = Math.min(force, 8); 
        for (let i = 0; i < windCount; i++) {
            let yPos = 40 + (i * 20);
            let length = 40 + (force * 15);
            let xPos = 30 + (i * 25);
            windLines += `<line x1="${xPos}" y1="${yPos}" x2="${xPos + length}" y2="${yPos}" stroke="#ffffff" stroke-width="${Math.max(1, force/3)}" opacity="${0.1 + (force/20)}" />`;
        }

        // Return the full integrated inline SVG string
        return `
            <svg viewBox="0 0 400 300" width="100%" height="100%" xmlns="http://w3.org">
                <!-- Sky/Background -->
                <rect width="400" height="300" fill="${config.sky}" />
                
                <!-- Wind Lines -->
                ${windLines}
                
                <!-- Distant Wave Layer -->
                <path d="${wavePathBehind}" fill="${config.water}" opacity="0.6"/>
                
                <!-- Foreground Wave Layer -->
                <path d="${wavePathFront}" fill="${config.water}"/>
                
                <!-- Breaking Crests/Foam/Spindrift -->
                ${foamElements}
            </svg>
        `;
    }
