<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudson Canyon 1000 FM Marine Weather</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #102a43;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: #0b69a3;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .meta-info {
            font-size: 0.9em;
            color: #627d98;
            margin-bottom: 20px;
        }
        .forecast-box {
            background-color: #f8fafc;
            border-left: 4px solid #0b69a3;
            padding: 15px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 1.05em;
            line-height: 1.6;
            overflow-x: auto;
        }
        .loading {
            color: #627d98;
            font-style: italic;
        }
        .error {
            color: #d32f2f;
            font-weight: bold;
        }
        .refresh-btn {
            background-color: #0b69a3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            background-color: #095585;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hudson Canyon to Baltimore Canyon to 1000 FM</h1>
    <div class="meta-info">Zone ID: ANZ820 | Data Source: National Weather Service</div>
    
    <button class="refresh-btn" onclick="fetchMarineForecast()">Refresh Forecast</button>
    
    <div id="forecast-container">
        <p class="loading">Fetching current marine conditions from NOAA...</p>
    </div>
</div>

<script>
    async function fetchMarineForecast() {
        const container = document.getElementById('forecast-container');
        container.innerHTML = '<p class="loading">Updating live text...</p>';
        
        // Target the official NWS marine text product endpoint
        const targetUrl = 'https://noaa.gov';
        // Utilizing a public CORS proxy to allow browser-side fetching
        const proxyUrl = 'https://allorigins.win' + encodeURIComponent(targetUrl);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Network response failed');
            
            const textData = await response.text();
            
            // Render the raw formatted text report directly from NOAA
            container.innerHTML = `
                <h3>Current Offshore Conditions & Outlook</h3>
                <div class="forecast-box">${escapeHtml(textData)}</div>
            `;
        } catch (error) {
            container.innerHTML = `
                <p class="error">Error loading weather conditions.</p>
                <p>Please try again later or view the feed directly at 
                <a href="${targetUrl}" target="_blank">NOAA Text Server</a>.</p>
            `;
            console.error('Fetch error:', error);
        }
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Load forecast immediately on page load
    fetchMarineForecast();
</script>

</body>
</html>
