<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudson Canyon 1000 FM Live Telemetry</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b1329;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .dashboard {
            max-width: 600px;
            margin: 40px auto;
            background: #1c2541;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #3b82f633;
        }
        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid #3b82f633;
            padding-bottom: 10px;
        }
        .meta {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .card {
            background: #0b1329;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        .card-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .card-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f1f5f9;
            margin-top: 5px;
        }
        .loading {
            color: #38bdf8;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>Hudson Canyon (1000 FM)</h1>
    <div class="meta" id="station-meta">Coordinates: 39.55°N, 72.41°W | Source: Global Ocean Wave Models</div>

    <div id="data-grid" class="grid" style="display:none;">
        <div class="card">
            <div class="card-label">Significant Wave Height</div>
            <div id="wave-height" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Dominant Wave Period</div>
            <div id="wave-period" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Swell Wave Height</div>
            <div id="swell-height" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Swell Direction</div>
            <div id="swell-dir" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Wind Wave Height</div>
            <div id="wind-wave" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-label">Wave Direction</div>
            <div id="wave-dir" class="card-value">--</div>
        </div>
    </div>
    
    <div id="status-message" class="loading">Querying open-ocean wave grid parameters...</div>
</div>

<script>
    async function fetchCanyonData() {
        const statusElement = document.getElementById('status-message');
        
        // Exact location coordinates for Hudson Canyon's deep offshore 1000 FM contour drop
        const lat = 39.5518;
        const lon = -72.4075;
        
        // Querying Open-Meteo's specific offshore marine engine using imperial lengths (feet)
        const apiUrl = `https://open-meteo.com{lat}&longitude=${lon}&hourly=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_direction,wind_wave_height&length_unit=imperial&timezone=auto`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("Marine API failed to respond.");
            
            const json = await response.json();
            
            const now = new Date();
            let timeIndex = -1;

            // 1. Try matching using local browser time values
            const localYear = now.getFullYear();
            const localMonth = String(now.getMonth() + 1).padStart(2, '0');
            const localDay = String(now.getDate()).padStart(2, '0');
            const localHour = String(now.getHours()).padStart(2, '0');
            const localTarget = `${localYear}-${localMonth}-${localDay}T${localHour}:00`;
            timeIndex = json.hourly.time.indexOf(localTarget);

            // 2. Fallback: Try matching using UTC time strings if timezones skew
            if (timeIndex === -1) {
                const utcYear = now.getUTCFullYear();
                const utcMonth = String(now.getUTCMonth() + 1).padStart(2, '0');
                const utcDay = String(now.getUTCDate()).padStart(2, '0');
                const utcHour = String(now.getUTCHours()).padStart(2, '0');
                const utcTarget = `${utcYear}-${utcMonth}-${utcDay}T${utcHour}:00`;
                timeIndex = json.hourly.time.indexOf(utcTarget);
            }

            // 3. Absolute Fallback: Default to index 0 if the API payload matches an offset day grid
            if (timeIndex === -1) {
                timeIndex = 0;
            }

            // Extract metrics securely using our verified array index pointer
            const waveHeight = json.hourly.wave_height[timeIndex];
            const wavePeriod = json.hourly.wave_period[timeIndex];
            const waveDir = json.hourly.wave_direction[timeIndex];
            const swellHeight = json.hourly.swell_wave_height[timeIndex];
            const swellDir = json.hourly.swell_wave_direction[timeIndex];
            const windWave = json.hourly.wind_wave_height[timeIndex];

            // Render numeric metrics safely
            document.getElementById('wave-height').innerText = typeof waveHeight === 'number' ? `${waveHeight.toFixed(1)} ft` : 'N/A';
            document.getElementById('wave-period').innerText = typeof wavePeriod === 'number' ? `${wavePeriod.toFixed(0)} sec` : 'N/A';
            document.getElementById('swell-height').innerText = typeof swellHeight === 'number' ? `${swellHeight.toFixed(1)} ft` : 'N/A';
            document.getElementById('swell-dir').innerText = typeof swellDir === 'number' ? `${swellDir}°` : 'N/A';
            document.getElementById('wind-wave').innerText = typeof windWave === 'number' ? `${windWave.toFixed(1)} ft` : 'N/A';
            document.getElementById('wave-dir').innerText = typeof waveDir === 'number' ? `${waveDir}°` : 'N/A';

            // Print the timestamp tracking exactly when the data payload was measured
            document.getElementById('station-meta').innerText = `Data Frame Time: ${json.hourly.time[timeIndex]} | Coordinates: 39.55°N, 72.41°W`;

            // Toggle visibility
            statusElement.style.display = 'none';
            document.getElementById('data-grid').style.display = 'grid';

        } catch (error) {
            statusElement.innerText = "Error: Failed to stream ocean wave telemetry data grid.";
            statusElement.style.color = '#ef4444';
            console.error(error);
        }
    }

    fetchCanyonData();
</script>
</body>
</html>
